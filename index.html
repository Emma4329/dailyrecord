<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7B4B9C">
<title>记录平台</title>
<style>
  :root {
    --primary: #7B4B9C; --primary-light: #C9A3DC; --primary-dark: #5A3578;
    --bg: #FAF6FB; --card: #FFFFFF; --border: #E8DCEF;
    --text: #3D2B45; --text-light: #8B7390;
    --success: #2D7D46; --warning: #C77D0D; --danger: #C0392B; --info: #3B7DD8;
    --pink: #E84A8F; --pink-light: #F8B8D0;
    --nav-bg: #3D2B45; --nav-text: #C9A3DC; --nav-active: #FFFFFF;
    --shadow: 0 2px 8px rgba(123,75,156,0.10);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; min-height: 100vh;
  }

  /* ====== 顶部标题 ====== */
  .top-bar {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white; padding: 14px 18px; position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .top-bar h1 { font-size: 18px; font-weight: 700; }
  .top-bar .date { font-size: 11px; opacity: 0.85; }

  /* ====== 主区域 ====== */
  .main {
    flex: 1; min-width: 0; padding: 14px 14px 90px 14px;
    overflow-y: auto;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* ====== 通用卡片 ====== */
  .card {
    background: var(--card); border-radius: 10px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .card-title {
    font-size: 15px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
    color: var(--primary-dark);
  }
  .card-title .icon { font-size: 18px; }

  /* ====== 统计卡 ====== */
  .stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 14px;
  }
  .stat-card {
    background: var(--card); padding: 12px 14px; border-radius: 8px;
    box-shadow: var(--shadow); border-left: 3px solid var(--primary);
  }
  .stat-card.pink { border-left-color: var(--pink); }
  .stat-card.success { border-left-color: var(--success); }
  .stat-card.info { border-left-color: var(--info); }
  .stat-card.warning { border-left-color: var(--warning); }
  .stat-card .label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
  .stat-card .value { font-size: 20px; font-weight: 700; }
  .stat-card .unit { font-size: 11px; color: var(--text-light); font-weight: normal; margin-left: 2px; }

  /* ====== 表单元素 ====== */
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .form-row label { font-size: 12px; color: var(--text-light); font-weight: 600; }
  input[type="date"], input[type="number"], input[type="text"], select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 15px; font-family: inherit;
    background: var(--card); color: var(--text); transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--primary);
  }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .btn {
    padding: 10px 20px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-pink { background: var(--pink); color: white; }
  .btn-pink:hover { background: #C73A7F; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger { background: transparent; border: 1.5px solid #E8C0BC; color: var(--danger); padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  .btn-danger:hover { background: #FDE8E8; }

  /* ====== 表格 ====== */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 420px; border-collapse: collapse; font-size: 13px; }
  thead { position: sticky; top: 0; background: var(--card); z-index: 5; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  tbody tr:hover { background: var(--bg); }
  .empty-tip { text-align: center; padding: 30px 16px; color: var(--text-light); font-size: 13px; }

  /* ====== 底部导航 ====== */
  .sidebar {
    width: 100%; background: var(--nav-bg); color: var(--nav-text);
    display: flex; flex-direction: row; padding: 6px 4px;
    position: fixed; bottom: 0; left: 0; right: 0; top: auto;
    overflow-x: auto; overflow-y: hidden; z-index: 100;
    border-top: 1px solid rgba(255,255,255,0.1);
    justify-content: space-around;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 5px 10px; cursor: pointer; transition: all 0.2s;
    font-size: 10px; border-bottom: 2px solid transparent;
    border-radius: 6px; white-space: nowrap; min-width: 56px;
    color: var(--nav-text); user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #FFF; }
  .nav-item.active {
    background: rgba(255,255,255,0.1); color: var(--nav-active);
    border-bottom-color: var(--primary-light); font-weight: 600;
  }
  .nav-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px;
    font-size: 14px; flex-shrink: 0;
  }
  .nav-icon.period { background: #E84A8F; color: #FFF; }
  .nav-icon.weight { background: #3B7DD8; color: #FFF; }
  .nav-icon.anniv { background: #C77D0D; color: #FFF; }

  /* ====== 经期模块专用 ====== */
  .period-day-badge {
    display: inline-block; background: var(--pink-light); color: var(--pink);
    padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .period-day-badge.danger { background: #FDE8E8; color: var(--danger); }
  .period-day-badge.warning { background: #FFF3D6; color: var(--warning); }
  .period-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
  .period-cal .dow { text-align: center; font-size: 10px; color: var(--text-light); padding: 4px 0; }
  .period-cal .day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 12px; border-radius: 50%; background: var(--bg); position: relative;
  }
  .period-cal .day.period { background: var(--pink); color: white; font-weight: 700; }
  .period-cal .day.predicted { background: var(--pink-light); color: var(--pink); }
  .period-cal .day.fertile { background: var(--bg); color: var(--text); border: 2px solid var(--success); }
  .period-cal .day.ovulation { background: transparent; color: var(--text); border: 2px solid var(--pink); font-weight: 700; }
  .period-cal .day.today { background: var(--success); color: white; font-weight: 700; border: none; box-shadow: none; }
  .period-cal .day.other-month { opacity: 0.3; }

  /* 体重日历 */
  .weight-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
  .weight-cal .dow { text-align: center; font-size: 10px; color: var(--text-light); padding: 4px 0; }
  .weight-cal .wday {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; border-radius: 50%; background: var(--bg); position: relative; padding: 2px;
  }
  .weight-cal .wday .wday-num { line-height: 1.1; }
  .weight-cal .wday.recorded { background: rgba(59,125,216,0.12); border: 1.5px solid var(--info); }
  .weight-cal .wday .wday-weight {
    font-size: 9px; font-weight: 700; color: var(--info); line-height: 1.1; margin-top: 1px; cursor: pointer;
  }
  .weight-cal .wday.today { background: var(--info); }
  .weight-cal .wday.today .wday-num,
  .weight-cal .wday.today .wday-weight { color: #fff; }
  .weight-cal .wday.other-month { opacity: 0.3; }
  .weight-cal .wday.selected { background: var(--danger); border-color: var(--danger); }
  .weight-cal .wday.selected .wday-num,
  .weight-cal .wday.selected .wday-weight { color: #fff; }

  /* ====== 体重趋势图 ====== */
  .weight-chart { width: 100%; height: 180px; position: relative; margin: 10px 0; }
  .weight-chart svg { width: 100%; height: 100%; overflow: visible; }

  /* ====== 纪念日倒计时 ====== */
  .anniv-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px;
  }
  .anniv-item:last-child { border-bottom: none; }
  .anniv-info { flex: 1; min-width: 0; }
  .anniv-name { font-size: 14px; font-weight: 600; }
  .anniv-date { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .anniv-countdown { text-align: right; flex-shrink: 0; }
  .anniv-days { font-size: 22px; font-weight: 700; color: var(--primary); }
  .anniv-days.past { color: var(--text-light); }
  .anniv-label { font-size: 10px; color: var(--text-light); }

  /* ====== 工具栏 ====== */
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

  .hint { font-size: 11px; color: var(--text-light); margin-top: 8px; line-height: 1.6; }
  .days-left {
    background: #E8F3FB; color: var(--primary-dark);
    padding: 14px 12px; border-radius: 10px; text-align: center;
    font-size: 14px; font-weight: 700; margin-bottom: 12px;
  }
  .days-left strong { font-size: 18px; color: var(--primary); margin: 0 2px; }
  .diet-suggest {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 60;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); max-height: 210px; overflow-y: auto; margin-top: 4px;
  }
  .diet-suggest .diet-opt {
    padding: 11px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .diet-suggest .diet-opt:last-child { border-bottom: none; }
  .diet-suggest .diet-opt:hover { background: var(--bg); }
  #weightHistoryTable thead th, #weightTableBody td { white-space: nowrap; }
  #weightTableBody td:nth-child(2), #weightHistoryTable thead th:nth-child(2) { white-space: normal; width: 76px; min-width: 66px; vertical-align: top; text-align: left; }
  #weightTableBody td:nth-child(3), #weightHistoryTable thead th:nth-child(3) { white-space: nowrap; width: 56px; min-width: 48px; }
  #weightTableBody td:nth-child(4), #weightHistoryTable thead th:nth-child(4) { white-space: normal; min-width: 128px; }
  #weightTableBody td:nth-child(5), #weightHistoryTable thead th:nth-child(5) { white-space: normal; min-width: 96px; width: 96px; }
  .weight-form-line { display: flex; gap: 10px; align-items: stretch; }
  .weight-form-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .weight-form-col.date-col { flex: 1.6; }
  .weight-form-col.weight-col { flex: 0.7; }
  .weight-form-col.date-col input { width: 144px; max-width: 144px; flex: none; }
  .weight-form-col input { height: 46px; padding: 0 10px; line-height: 46px; box-sizing: border-box; }
  .weight-col input { text-align: right; }
  .yr { font-size: 10px; color: var(--text-light); }
  .next-predict { font-size: 13px; color: var(--text-light); text-align: center; margin-bottom: 12px; }
  .diet-board-table { table-layout: fixed; width: 100%; min-width: 0; }
  .diet-board-table th, .diet-board-table td { text-align: center; }
  .diet-board-table td { vertical-align: middle; }
  .diet-board-table th:nth-child(1), .diet-board-table td:nth-child(1) { width: 30px; }
  .diet-board-table th:nth-child(2), .diet-board-table th:nth-child(3), .diet-board-table td:nth-child(2), .diet-board-table td:nth-child(3) { width: 48px; }
  .diet-board-table th:nth-child(4), .diet-board-table td:nth-child(4) { width: auto; }
  .diet-board-table th:nth-child(5), .diet-board-table td:nth-child(5) { width: 96px; }
  .weight-scale-card {
    text-align: center; padding: 18px 8px 16px;
    background: linear-gradient(135deg, #2196F3, #03A9F4);
    border-radius: 16px; color: #fff;
  }
  .scale-date { font-size: 14px; color: rgba(255,255,255,0.92); margin-bottom: 14px; }
  .scale-main { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .scale-circle {
    width: 140px; height: 140px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12);
    flex-shrink: 0;
  }
  .scale-weight-row { display: flex; align-items: baseline; justify-content: center; gap: 3px; }
  .scale-weight { font-size: 40px; font-weight: 700; color: #fff; line-height: 1; text-align: center; }
  .scale-unit { font-size: 14px; color: rgba(255,255,255,0.9); margin-top: 4px; }
  .scale-side { flex: 1; min-width: 0; text-align: center; }
  .scale-side-label { font-size: 11px; color: rgba(255,255,255,0.85); margin-bottom: 5px; }
  .scale-side-value { font-size: 13px; font-weight: 700; color: #fff; }
  .scale-score { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.92); }
  .scale-arrow { font-size: 10px; margin-right: 2px; }
  .chart-popup {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 12px 14px; margin-top: 8px;
    font-size: 13px; color: var(--text); position: relative;
  }
  .chart-popup .pop-date { font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
  .chart-popup .pop-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .chart-popup .pop-label { color: var(--text-light); }
  .chart-popup .pop-value { font-weight: 700; }
  .chart-popup .pop-close {
    position: absolute; top: 4px; right: 8px; font-size: 16px; color: var(--text-light);
    cursor: pointer; line-height: 1;
  }
  .section-divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* 内滑条容器：历史记录 / 饮食掉秤榜 */
  .hist-scroll, .diet-scroll {
    min-height: 576px; max-height: 576px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border-radius: 8px;
  }
  .hist-scroll table, .diet-scroll table { min-width: 420px; }
  #birthdayTable { table-layout: fixed; width: 100%; }
  #birthdayTable thead th, #birthdayBody td { text-align: center; vertical-align: middle; }
  /* 2:2:2:4.5 字宽比例 */
  #birthdayTable thead th:nth-child(1), #birthdayBody td:nth-child(1) { width: 23%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #birthdayTable thead th:nth-child(2), #birthdayBody td:nth-child(2) { width: 18%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #birthdayTable thead th:nth-child(3), #birthdayBody td:nth-child(3) { width: 25%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #birthdayTable thead th:nth-child(4), #birthdayBody td:nth-child(4) { width: 34%; white-space: normal; word-break: break-all; }

  .anniv-list-table { table-layout: fixed; width: 100%; border-collapse: collapse; min-width: 420px; }
  .anniv-list-table th, .anniv-list-table td { border-bottom: 1px solid var(--border); padding: 10px 4px; font-size: 12px; text-align: center; vertical-align: middle; }
  .anniv-list-table thead th { color: var(--text-light); font-weight: 600; background: var(--bg); }
  /* 列宽：名称2 / 日期4 / 类型2 / 距今天数3 / 删除2 (总13) */
  .anniv-list-table th:nth-child(1), .anniv-list-table td:nth-child(1) { width: 7%; white-space: normal; word-break: break-all; }
  .anniv-list-table th:nth-child(2), .anniv-list-table td:nth-child(2) { width: 19%; white-space: normal; word-break: break-all; }
  .anniv-list-table th:nth-child(3), .anniv-list-table td:nth-child(3) { width: 3%; }
  .anniv-list-table th:nth-child(4), .anniv-list-table td:nth-child(4) { width: 9%; white-space: normal; }
  .anniv-list-table th:nth-child(5), .anniv-list-table td:nth-child(5) { width: 13%; }
  .anniv-list-table .btn-danger { padding: 4px 8px; font-size: 11px; }

  .weekly-modal-mask {
    position: fixed; inset: 0; background: rgba(61,43,69,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .weekly-modal {
    background: var(--card); border-radius: 16px; padding: 24px 22px; max-width: 320px;
    width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.25); text-align: center;
  }
  .weekly-modal .wm-icon { font-size: 44px; margin-bottom: 10px; }
  .weekly-modal .wm-title { font-size: 18px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; }
  .weekly-modal .wm-text { font-size: 13px; color: var(--text-light); line-height: 1.7; margin-bottom: 18px; }
  .weekly-modal .wm-btn { width: 100%; }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600;
  }
</style>
</head>
<body>

<!-- ====== 顶部标题栏 ====== -->
<div class="top-bar">
  <h1 id="topTitle">经期</h1>
  <span class="date" id="topDate"></span>
</div>

<!-- ====== 主区域 ====== -->
<div class="main">

  <!-- ========== 体重记录 ========== -->
  <div class="page active" id="page-weight">
    <div class="card">
      <div class="card-title"><span class="icon">⚖️</span>记录体重</div>
      <div class="form-row">
        <div class="weight-form-line">
          <div class="weight-form-col date-col">
            <label>日期</label>
            <input type="date" id="weightDate" lang="zh-CN">
          </div>
          <div class="weight-form-col weight-col">
            <label>体重（kg）</label>
            <input type="number" id="weightVal" step="0.01" placeholder="如 55.50">
          </div>
        </div>
      </div>
      <div class="form-row" style="position:relative;">
        <label>饮食（可选）</label>
        <input type="text" id="weightNote" placeholder="如早餐鸡蛋牛奶、午餐沙拉" autocomplete="off">
        <div id="dietSuggest" class="diet-suggest" style="display:none;"></div>
      </div>
      <div class="form-row">
        <label>饱腹感（可选）</label>
        <select id="weightFull">
          <option value="">不填</option>
          <option value="整天饱">整天饱</option>
          <option value="半饱（7点左右）">半饱（7点左右）</option>
          <option value="饿">饿</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="saveWeight()" style="width:100%;">保存记录</button>
    </div>

    <!-- 体重统计（圆形秤样式） -->
    <div class="card">
      <div class="card-title"><span class="icon">📈</span>体重统计</div>
      <div class="weight-scale-card" id="weightScaleCard">
        <div class="scale-date" id="scaleDate">--</div>
        <div class="scale-main">
          <div class="scale-side" id="scaleTargetDiff">
            <div class="scale-side-label">离目标还差</div>
            <div class="scale-side-value">--</div>
          </div>
          <div class="scale-circle">
            <div class="scale-weight" id="scaleWeight">--</div>
            <div class="scale-unit">公斤</div>
          </div>
          <div class="scale-side" id="scaleLastDiff">
            <div class="scale-side-label">比上次测量</div>
            <div class="scale-side-value">--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 体重日历 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">📉</span>体重日历
        <span style="margin-left:auto;display:flex;gap:6px;align-items:center;">
          <button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="shiftWeightChart(-1)">上月</button>
          <span id="weightChartMonthLabel" style="font-size:13px;font-weight:600;min-width:70px;text-align:center;"></span>
          <button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="shiftWeightChart(1)">下月</button>
        </span>
      </div>
      <div class="weight-cal" id="weightChart"></div>
      <div class="hint" style="margin-top:8px;">
        <span style="display:inline-block;width:10px;height:10px;background:var(--info);border-radius:50%;vertical-align:middle;"></span> 已记录体重

<script>
// ====== 数据持久化 ======
const KEY_PERIOD = 'dr_period_v1';
const KEY_WEIGHT = 'dr_weight_v1';
const KEY_ANNIV  = 'dr_anniv_v1';

let periods = JSON.parse(localStorage.getItem(KEY_PERIOD) || '[]');
let weights = JSON.parse(localStorage.getItem(KEY_WEIGHT) || '[]');
let annivs  = JSON.parse(localStorage.getItem(KEY_ANNIV)  || '[]');
let dietHistory = JSON.parse(localStorage.getItem('dr_diet_v1') || '[]');
let weightTarget = 64; // 固定目标体重 64kg

function savePeriods() { localStorage.setItem(KEY_PERIOD, JSON.stringify(periods)); }
function saveWeights() { localStorage.setItem(KEY_WEIGHT, JSON.stringify(weights)); }
function saveAnnivs()  { localStorage.setItem(KEY_ANNIV,  JSON.stringify(annivs)); }

// ====== 工具函数 ======
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function daysBetween(a, b) {
  return Math.round((parseDate(b) - parseDate(a)) / 86400000);
}
function cnDate(s) {
  if (!s) return '';
  const d = parseDate(s);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function getRelativeDayLabel(dateStr) {
  const d = daysBetween(dateStr, todayStr());
  if (d === 0) return '今天';
  if (d === 1) return '昨天';
  if (d === -1) return '明天';
  return cnDate(dateStr);
}
function calcWeightScore(current, target) {
  if (!target || target <= 0 || weights.length < 2) return null;
  const vals = weights.map(w => w.val);
  const maxW = Math.max(...vals), minW = Math.min(...vals);
  if (target < current) {
    const denom = maxW - target;
    if (denom <= 0) return null;
    return Math.max(0, Math.min(100, Math.round((maxW - current) / denom * 100)));
  }
  if (target > current) {
    const denom = target - minW;
    if (denom <= 0) return null;
    return Math.max(0, Math.min(100, Math.round((current - minW) / denom * 100)));
  }
  return 100;
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtKg(n, signed) {
  if (n === null || n === undefined || isNaN(n)) return '--';
  const s = Math.abs(n).toFixed(2).replace(/\.?0+$/, '');
  if (n > 0 && signed) return '+' + s;
  if (n < 0) return '-' + s;
  return s;
}

// ====== 页面切换 ======
const PAGE_TITLES = { period: '经期', weight: '体重', anniv: '纪念日' };
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${name}"]`).classList.add('active');
  document.getElementById('topTitle').textContent = PAGE_TITLES[name] || '记录平台';
  document.title = PAGE_TITLES[name] + '记录台';
  if (name === 'period') { renderPeriod(); }
  if (name === 'weight') { renderWeight(); }
  if (name === 'anniv')  { renderAnniv(); }
  window.scrollTo(0, 0);
}

// ====== 经期模块 ======
function savePeriod() {
  const start = document.getElementById('periodStart').value || todayStr();
  periods.push({ start, end: null, flow: 'normal', note: '', ts: Date.now() });
  periods.sort((a,b) => a.start < b.start ? -1 : 1);
  savePeriods();
  renderPeriod();
  alert('已保存，记录日期：' + cnDate(start));
}

function deletePeriod(ts) {
  if (!confirm('确认删除这条经期记录？')) return;
  periods = periods.filter(p => p.ts !== ts);
  savePeriods();
  renderPeriod();
}

// 修改：回填到顶部经期表单，保存时覆盖原记录
function editPeriod(ts) {
  const p = periods.find(x => x.ts === ts);
  if (!p) return;
  document.getElementById('periodStart').value = p.start;
  // 覆盖式保存：先移除旧记录，保存时以新 ts 写入
  periods = periods.filter(x => x.ts !== ts);
  savePeriods();
  renderPeriod();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getPeriodDuration(p) {
  if (!p.end) return null;
  return daysBetween(p.start, p.end) + 1;
}

function getAvgCycle() {
  if (periods.length < 2) return null;
  let total = 0, count = 0;
  for (let i = 1; i < periods.length; i++) {
    total += daysBetween(periods[i-1].start, periods[i].start);
    count++;
  }
  return Math.round(total / count);
}

function getAvgDuration() {
  const valid = periods.map(getPeriodDuration).filter(d => d !== null);
  if (!valid.length) return null;
  return Math.round(valid.reduce((a,b) => a+b, 0) / valid.length);
}

function getNextPeriodPredict() {
  if (periods.length === 0) return null;
  const last = periods[periods.length - 1];
  const avgCycle = getAvgCycle();
  const cycle = avgCycle || 28;
  const d = parseDate(last.start);
  d.setDate(d.getDate() + cycle);
  return fmtDate(d);
}

// 排卵日预测：下次经期预测日往前推14天（黄体期固定14天）
function getOvulationPredict() {
  const next = getNextPeriodPredict();
  if (!next) return null;
  const d = parseDate(next);
  d.setDate(d.getDate() - 14);
  return fmtDate(d);
}

// 易孕窗口：排卵日前5天 ~ 后1天
function getFertileDays() {
  const ovu = getOvulationPredict();
  const set = new Set();
  if (!ovu) return set;
  const od = parseDate(ovu);
  for (let i = -5; i <= 1; i++) {
    const d = new Date(od);
    d.setDate(d.getDate() + i);
    set.add(fmtDate(d));
  }
  return set;
}

function renderPeriod() {
  // 统计（统计卡已移除，此处仅用于下方计算）
  const avgCycle = getAvgCycle();
  const next = getNextPeriodPredict();

  // 记录卡：还剩多少天（文字“还有”，数字标红）
  const daysLeftEl = document.getElementById('periodDaysLeft');
  if (!next) {
    daysLeftEl.innerHTML = '记录首次经期后开始计算周期与倒计时。';
  } else {
    const dl = daysBetween(todayStr(), next);
    if (dl > 0) daysLeftEl.innerHTML = '还有 <strong style="color:var(--danger)">' + dl + '</strong> 天';
    else if (dl === 0) daysLeftEl.innerHTML = '⚠️ 预测经期就在今天，请留意身体变化。';
    else daysLeftEl.innerHTML = '已超过预测经期 <strong style="color:var(--danger)">' + Math.abs(dl) + '</strong> 天，留意是否漏记。';
  }
  // 记录卡：下次预测日期
  document.getElementById('periodNextLine').textContent = next ? ('下次预测 ' + cnDate(next)) : '';

  // 日历
  renderCalendar();

  // 历史表
  const tbody = document.getElementById('periodTableBody');
  const empty = document.getElementById('periodEmpty');
  const avgInline = document.getElementById('periodAvgCycleInline');
  if (avgCycle) avgInline.textContent = '平均周期 ' + avgCycle + ' 天';
  else avgInline.textContent = '';

  if (periods.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const asc = periods.slice().sort((a, b) => a.start < b.start ? -1 : 1);
    tbody.innerHTML = periods.slice().reverse().map(p => {
      const idx = asc.findIndex(x => x.ts === p.ts);
      let since = '—';
      if (idx > 0) since = daysBetween(asc[idx - 1].start, p.start) + ' 天';
      return `<tr>
        <td>${cnDate(p.start)}</td>
        <td>${since}</td>
        <td><button class="btn btn-outline" style="padding:4px 8px;font-size:11px;" onclick="editPeriod(${p.ts})">修改</button></td>
        <td><button class="btn btn-danger" style="padding:4px 8px;font-size:11px;" onclick="deletePeriod(${p.ts})">删除</button></td>
      </tr>`;
    }).join('');
  }
}

// ====== 经期日历 ======
let calYear, calMonth;
{
  const d = new Date();
  calYear = d.getFullYear(); calMonth = d.getMonth();
}

function shiftCalendar(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  const labels = ['日','一','二','三','四','五','六'];
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthLabel').textContent = `${calYear}年${monthNames[calMonth]}`;

  const firstDay = new Date(calYear, calMonth, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  const today = todayStr();

  // 预测经期日
  const predictedDays = new Set();
  const next = getNextPeriodPredict();
  if (next) {
    const avgDur = getAvgDuration() || 5;
    const nd = parseDate(next);
    for (let i = 0; i < avgDur; i++) {
      const d = new Date(nd);
      d.setDate(d.getDate() + i);
      predictedDays.add(fmtDate(d));
    }
  }

  // 实际经期日
  const periodDays = new Set();
  for (const p of periods) {
    if (!p.end) {
      periodDays.add(p.start);
    } else {
      let d = parseDate(p.start);
      const end = parseDate(p.end);
      while (d <= end) {
        periodDays.add(fmtDate(d));
        d.setDate(d.getDate() + 1);
      }
    }
  }

  // 排卵日 + 易孕窗口
  const ovuDay = getOvulationPredict();
  const fertileDays = getFertileDays();

  let html = '';
  for (let i = 0; i < 7; i++) html += `<div class="dow">${labels[i]}</div>`;

  for (let i = startDow - 1; i >= 0; i--) {
    html += `<div class="day other-month">${prevMonthDays - i}</div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'day';
    if (periodDays.has(ds)) cls += ' period';
    else if (predictedDays.has(ds)) cls += ' predicted';
    else if (ds === ovuDay) cls += ' ovulation';
    else if (fertileDays.has(ds)) cls += ' fertile';
    if (ds === today) cls += ' today';
    html += `<div class="${cls}">${d}</div>`;
  }
  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) html += `<div class="day other-month">${i}</div>`;

  document.getElementById('periodCal').innerHTML = html;
}

// ====== 体重模块 ======
function saveWeight() {
  const date = document.getElementById('weightDate').value;
  const val = parseFloat(document.getElementById('weightVal').value);
  const note = document.getElementById('weightNote').value.trim();
  const fullness = document.getElementById('weightFull').value;
  if (!date) { alert('请选择日期'); return; }
  if (isNaN(val) || val <= 0 || val > 500) { alert('请输入合理的体重'); return; }

  // 同一天覆盖
  const existing = weights.find(w => w.date === date);
  if (existing) {
    existing.val = val; existing.note = note; existing.fullness = fullness; existing.ts = Date.now();
  } else {
    weights.push({ date, val, note, fullness, ts: Date.now() });
  }
  weights.sort((a,b) => a.date < b.date ? -1 : 1);
  saveWeights();
  document.getElementById('weightDate').value = '';
  document.getElementById('weightVal').value = '';
  document.getElementById('weightNote').value = '';
  document.getElementById('weightFull').value = '';
  renderWeight();
  alert('已保存');
}

function deleteWeight(ts) {
  if (!confirm('确认删除这条体重记录？')) return;
  weights = weights.filter(w => w.ts !== ts);
  saveWeights();
  renderWeight();
}

// 修改：把记录回填到顶部表单，方便编辑后保存（同一天覆盖）
function editWeight(ts) {
  const w = weights.find(x => x.ts === ts);
  if (!w) return;
  document.getElementById('weightDate').value = w.date;
  document.getElementById('weightVal').value = w.val;
  document.getElementById('weightNote').value = w.note || '';
  document.getElementById('weightFull').value = w.fullness || '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 区间总变化（斤）：末-初，负=减重；1kg=2斤
function totalChangeJin(list) {
  if (list.length < 2) return '--';
  const sorted = list.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const jin = (sorted[sorted.length - 1].val - sorted[0].val) * 2;
  if (Math.abs(jin) < 0.05) return '持平';
  if (jin < 0) return `<span style="color:var(--success)">减重 ${Math.abs(jin).toFixed(2)}</span><span class="unit">斤</span>`;
  return `<span style="color:var(--danger)">增重 ${jin.toFixed(2)}</span><span class="unit">斤</span>`;
}

function renderWeight() {
  // 圆形秤统计卡
  const scaleDate = document.getElementById('scaleDate');
  const scaleWeight = document.getElementById('scaleWeight');
  const scaleTargetDiff = document.querySelector('#scaleTargetDiff .scale-side-value');
  const scaleLastDiff = document.querySelector('#scaleLastDiff .scale-side-value');

  if (weights.length === 0) {
    scaleDate.textContent = '--';
    scaleWeight.textContent = '--';
    scaleTargetDiff.innerHTML = '--';
    scaleLastDiff.innerHTML = '--';
  } else {
    const latest = weights[weights.length - 1];
    const prev = weights.length >= 2 ? weights[weights.length - 2] : null;

    scaleDate.textContent = getRelativeDayLabel(latest.date);
    scaleWeight.textContent = fmtKg(latest.val);

    // 离目标还差（白色）
    const td = latest.val - weightTarget;
    scaleTargetDiff.innerHTML = `${fmtKg(td, true)}公斤`;

    // 比上次测量（白色）
    if (prev) {
      const diff = latest.val - prev.val;
      const arrow = diff < 0 ? '▼' : (diff > 0 ? '▲' : '');

      const d = parseDate(w.date);
      return d.getFullYear() === histYear && d.getMonth() === histMonth;
    });
    if (monthWeights.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = '该月暂无体重记录';

      empty.style.display = 'none';
      const reversed = monthWeights.slice().reverse();
      const allAsc = weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
      tbody.innerHTML = reversed.map((w) => {
      const idx = allAsc.findIndex(x => x.ts === w.ts);
      const next = (idx >= 0 && idx < allAsc.length - 1) ? allAsc[idx + 1] : null; // 实际下一条记录
      let change = '';
      if (next) {
        const diff = next.val - w.val; // 下一条 - 本条
        const color = diff > 0 ? 'var(--danger)' : (diff < 0 ? 'var(--success)' : 'var(--text-light)');
        change = `<span style="color:${color}">${fmtKg(diff, true)}kg</span>`;
      } else {
        change = '--';
      }
      return `<tr>
        <td>${change}</td>
        <td>${mdyDateBr(w.date)}</td>
        <td><strong>${fmtKg(w.val)}</strong> kg</td>
        <td style="font-size:11px;color:var(--text-light)">${w.note || ''}</td>
        <td style="font-size:11px;color:var(--text-light);white-space:normal;">${w.fullness || '—'}</td>
        <td><button class="btn btn-outline" style="padding:4px 8px;font-size:11px;" onclick="editWeight(${w.ts})">修改</button></td>
        <td><button class="btn btn-danger" style="padding:4px 8px;font-size:11px;" onclick="deleteWeight(${w.ts})">删除</button></td>
      </tr>`;
    }).join('');
    }
  }

  // 饮食记忆 + 掉秤榜
  refreshDietHistory();
  renderDietLossBoard();
}

function renderWeightChartMonth(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('weightChartMonthLabel').textContent = `${chartYear}年${monthNames[chartMonth]}`;

  const labels = ['日','一','二','三','四','五','六'];
  const firstDay = new Date(chartYear, chartMonth, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(chartYear, chartMonth + 1, 0).getDate();
  const prevMonthDays = new Date(chartYear, chartMonth, 0).getDate();
  const today = todayStr();

  // 当月记录的体重，按日期索引
  const byDate = {};
  const allAsc = weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  for (const w of allAsc) {
    const d = parseDate(w.date);
    if (d.getFullYear() === chartYear && d.getMonth() === chartMonth) byDate[w.date] = w;
  }
  // 每条记录的下一天变化
  function nextChange(w) {
    const idx = allAsc.findIndex(x => x.ts === w.ts);
    if (idx >= 0 && idx < allAsc.length - 1) return allAsc[idx + 1].val - w.val;
    return null;
  }

  let html = '';
  for (let i = 0; i < 7; i++) html += `<div class="dow">${labels[i]}</div>`;

  for (let i = startDow - 1; i >= 0; i--) html += `<div class="wday other-month">${prevMonthDays - i}</div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${chartYear}-${String(chartMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = byDate[ds];
    let cls = 'wday';
    let inner = `<span class="wday-num">${d}</span>`;
    if (rec) {
      cls += ' recorded';
      const safeDate = rec.date.replace(/'/g, "\\'");
      const safeFood = (rec.note || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const ch = nextChange(rec);
      const safeFull = (rec.fullness || '').replace(/'/g, "\\'");
      inner += `<span class="wday-weight" onclick="showWeightPointPopup('${safeDate}', ${rec.val}, ${ch === null ? 'null' : ch}, '${safeFood}', '${safeFull}')">${fmtKg(rec.val)}</span>`;
    }
    if (ds === today) cls += ' today';
    html += `<div class="${cls}" data-date="${ds}">${inner}</div>`;
  }

  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) html += `<div class="wday other-month">${i}</div>`;

  el.innerHTML = html;
}

function renderDietLossBoard() {
  const tbody = document.getElementById('dietBoardBody');
  const empty = document.getElementById('dietBoardEmpty');
  const sorted = weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const events = [];
  // 当天吃的食物，其掉秤幅度 = 次日体重 − 当天体重（掉秤为正）。
  // 例：8/22吃饺子(82.75)、8/23吃牛肉(82.25) → 饺子=82.25-82.75=-0.5(掉0.5)，牛肉=81.9-82.25=-0.35(掉0.35)
  for (let i = 0; i < sorted.length - 1; i++) {
    const cur = sorted[i];
    const food = (cur.note || '').trim();
    if (!food) continue; // 当天没记录饮食则不计
    const drop = cur.val - sorted[i + 1].val; // 当天体重 − 次日体重 = 掉秤幅度(正=掉秤)
    if (drop > 0) {
      events.push({ lossKg: drop, food, full: cur.fullness || '' });
    }
  }
  // 按食物分组：同一食物取最高/最低掉秤；饱腹感取该食物「最近一次有记录」的值
  const byFood = {};
  for (const e of events) {
    if (!byFood[e.food]) byFood[e.food] = { food: e.food, max: e.lossKg, min: e.lossKg, full: e.full || '' };
    else {
      if (e.lossKg > byFood[e.food].max) byFood[e.food].max = e.lossKg;
      if (e.lossKg < byFood[e.food].min) byFood[e.food].min = e.lossKg;
      if (e.full) byFood[e.food].full = e.full; // 后出现的覆盖（最新一次）
    }
  }
  const rows = Object.values(byFood);
  rows.sort((a, b) => b.max - a.max); // 按最高掉秤幅度排序
  if (rows.length === 0) {
    tbody.innerHTML = ''; empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = rows.map((r, idx) => `<tr>
      <td style="font-weight:700;color:var(--text-light);">${idx + 1}</td>
      <td style="color:var(--success);font-weight:700;white-space:nowrap;">${fmtKg(r.max)}kg</td>
      <td style="color:var(--warning);white-space:nowrap;">${fmtKg(r.min)}kg</td>
      <td style="white-space:normal;">${r.food}</td>
      <td style="font-size:11px;color:var(--text-light);white-space:normal;">${r.full || '—'}</td>
    </tr>`).join('');
  }
}

const LUNAR_MONTH = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_DAY = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function lunarYearDays(y) {
  let sum = 348;
  for (let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
  return sum + leapMonthDays(y);
}
function leapMonthDays(y) {
  if (leapMonth(y)) {
    // 闰月天数取决于该年信息是否含闰月大小标记
    return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
  }
  return 0;
}
function leapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
function lunarMonthDays(y, m) {
  return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29;
}
// 阳历 -> {ly, lm, ld, isLeap, lStr}
function solarToLunar(y, m, d) {
  const baseDate = Date.UTC(1900, 0, 31);
  const objDate = Date.UTC(y, m - 1, d);
  let offset = Math.round((objDate - baseDate) / 86400000);
  let temp = 0, ly = 1900;
  for (ly = 1900; ly < 2101 && offset > 0; ly++) { temp = lunarYearDays(ly); offset -= temp; }
  if (offset < 0) { offset += temp; ly--; }
  const leap = leapMonth(ly);
  let isLeap = false, lm, dm = 0;
  for (lm = 1; lm <= 12 && offset > 0; lm++) {
    dm = lunarMonthDays(ly, lm);
    if (leap > 0 && lm === leap + 1 && !isLeap) {
      // 进入闰月
      isLeap = true; dm = leapMonthDays(ly); lm--;
    } else {
      isLeap = false;
    }
    offset -= dm;
  }
  if (offset === 0 && leap > 0 && lm === leap + 1) {
    if (isLeap) { isLeap = false; } else { isLeap = true; lm--; }
  }
  if (offset < 0) { offset += dm; lm--; }
  const ld = offset + 1;
  const lStr = (isLeap ? '闰' : '') + LUNAR_MONTH[lm - 1] + '月' + LUNAR_DAY[ld - 1];
  return { ly, lm, ld, isLeap, lStr };
}
// 将农历（年,月,日）转换为对应阳历日期字符串（用于倒计时）
function lunarToSolar(ly, lm, ld, isLeap) {
  const baseDate = Date.UTC(1900, 0, 31);
  let offset = 0;
  for (let y = 1900; y < ly; y++) offset += lunarYearDays(y);
  const leap = leapMonth(ly);
  let month = 1;
  for (month = 1; month < lm; month++) {
    offset += lunarMonthDays(ly, month);
    if (leap > 0 && month === leap) offset += leapMonthDays(ly);
  }
  if (isLeap && leap > 0 && lm === leap + 1) offset += lunarMonthDays(ly, leap);
  offset += ld - 1;
  const d = new Date(baseDate + offset * 86400000);
  return fmtDate(d);
}

// 返回当年（或明年）对应的阳历日历日：农历按农历月日换算到阳历
function anniversarySolarDate(a, yearOffset) {
  const year = (new Date().getFullYear()) + (yearOffset || 0);
  if (a.cal === 'lunar' && a.lm && a.ld) {
    return lunarToSolar(year, a.lm, a.ld, false);
  }
  const target = parseDate(a.date);
  return `${year}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
}

// 出生日期展示文本
function birthDateText(a) {
  if (a.cal === 'lunar' && a.lunarText) return a.lunarText;
  const d = parseDate(a.date);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function getAnnivInfo(a) {
  const today = todayStr();
  const target = parseDate(a.date);
  if (a.type === 'together') {
    const days = daysBetween(a.date, today);
    return { days: Math.max(0, days), label: '在一起', past: false, isTogether: true };
  }
  if (a.type === 'countdown') {
    const days = daysBetween(today, a.date);
    return { days, label: days >= 0 ? '天后' : '天前', past: days < 0 };
  }
  if (a.type === 'birthday') {
    // 生日：当年/明年最近一次生日（已过的算明年）
    const year = new Date().getFullYear();
    let solar = anniversarySolarDate(a, 0);
    let bd = parseDate(solar);
    const t0 = new Date(today + 'T00:00:00');
    if (bd < t0) {
      solar = anniversarySolarDate(a, 1); // 明年生日
      bd = parseDate(solar);
    }
    const days = Math.round((bd - t0) / 86400000);
    const age = bd.getFullYear() - parseDate(a.date).getFullYear();
    return { days, label: '天后', past: false, age, isBirthday: true, birthDateText: birthDateText(a), displaySolar: solar };
  }
  // anniversary: 计算今年/明年的纪念日
  const year = new Date().getFullYear();
  let solar = anniversarySolarDate(a, 0);
  let thisYear = parseDate(solar);
  if (thisYear < new Date(today + 'T00:00:00')) {
    solar = anniversarySolarDate(a, 1);
    thisYear = parseDate(solar);
  }
  const days = Math.round((thisYear - new Date(today + 'T00:00:00')) / 86400000);
  const age = year - parseDate(a.date).getFullYear() - (thisYear.getFullYear() === year + 1 ? 1 : 0);
  return { days, label: '天后', past: false, age, isAnniversary: true, thisYearDate: fmtDate(thisYear) };
}

function renderAnniv() {
  const list = document.getElementById('annivList');
  const empty = document.getElementById('annivEmpty');
  renderBirthdayBoard(); // 同步生日卡片
  if (annivs.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // 排序：按倒计时升序（已过的放后面）
  const sorted = annivs.map(a => ({ a, info: getAnnivInfo(a) })).sort((x, y) => {
    if (x.info.past && !y.info.past) return 1;
    if (!x.info.past && y.info.past) return -1;
    return x.info.days - y.info.days;
  });

  const typeLabels = { anniversary: '每年纪念日', countdown: '倒计时', together: '在一起', birthday: '生日' };
  const today = todayStr();
  let rows = sorted.map(({ a, info }) => {
    const dateText = a.cal === 'lunar' && a.lunarText ? a.lunarText : cnDate(a.date);
    const rawDays = Math.abs(daysBetween(a.date, today));
    return `<tr>
      <td class="anniv-td-name">${a.name}</td>
      <td>${dateText}</td>
      <td>${typeLabels[a.type]}</td>
      <td>${rawDays}天</td>
      <td class="anniv-td-del"><button class="btn btn-danger" onclick="deleteAnniv(${a.ts})">删除</button></td>
    </tr>`;
  }).join('');
  list.innerHTML = `<div class="table-scroll">
    <table class="anniv-list-table">
      <thead><tr><th>名称</th><th>日期</th><th>类型</th><th>距今天数</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderBirthdayBoard() {
  const tbody = document.getElementById('birthdayBody');
  const empty = document.getElementById('birthdayEmpty');
  if (!tbody) return;
  const bdays = annivs
    .filter(a => a.type === 'birthday')
    .map(a => ({ a, info: getAnnivInfo(a) }))
    .sort((x, y) => x.info.days - y.info.days);
  if (bdays.length === 0) {
    tbody.innerHTML = ''; empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = bdays.map(({ a, info }) => `<tr>
      <td style="color:var(--primary);font-weight:700;">${info.days}天</td>
      <td>${a.name}</td>
      <td style="text-align:center;">${info.age}岁</td>
      <td style="text-align:center;">${info.birthDateText}</td>
    </tr>`).join('');
  }
}


// ====== 每周首次打开弹窗 ======
const KEY_WEEKLY_POPUP = 'dr_weekly_popup_v1';
function getISOWeekKey(d) {
  // 以「本周一」的日期作为周标识，保证同一自然周只弹一次
  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (date.getDay() + 6) % 7; // 周一=0
  date.setDate(date.getDate() - day);
  return `w${fmtDate(date)}`;
}
function closeWeeklyModal() {
  document.getElementById('weeklyModal').style.display = 'none';
}
// 导出全部记录数据为 JSON 文件
function exportAllData() {
  const data = {};
  const keys = ['dr_period_v1', 'dr_weight_v1', 'dr_anniv_v1', 'dr_diet_v1'];
  keys.forEach(k => {
    try { data[k] = JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { data[k] = []; }
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `记录平台数据_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeWeeklyModal();
}
function checkWeeklyPopup() {
  let last = '';
  try { last = localStorage.getItem(KEY_WEEKLY_POPUP) || ''; } catch (e) {}
  const wk = getISOWeekKey(new Date());
  if (last === wk) return; // 本周已弹过
  try { localStorage.setItem(KEY_WEEKLY_POPUP, wk); } catch (e) {}
  document.getElementById('weeklyModal').style.display = 'flex';
}

// ====== 初始化 ======
function init() {
  // 顶部日期
  const d = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('topDate').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
  document.getElementById('topTitle').textContent = PAGE_TITLES['weight'];
  document.title = PAGE_TITLES['weight'] + '记录台';

  // 默认日期填入今天
  document.getElementById('weightDate').value = todayStr();
  document.getElementById('annivDate').value = todayStr();
  const periodStartEl = document.getElementById('periodStart');
  if (periodStartEl) periodStartEl.value = todayStr();
  initDietAutocomplete();
  initLunarSelectors();
  toggleAnnivDateMode();

  renderWeight();
  renderPeriod();
  renderAnniv();
  checkWeeklyPopup();
}

init();
