<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7B4B9C">
<title>记录平台</title>
<style>
  :root {
    --primary: #7B4B9C; --primary-light: #C9A3DC; --primary-dark: #5A3578;
    --bg: #FAF6FB; --card: #FFFFFF; --border: #E8DCEF;
    --text: #3D2B45; --text-light: #8B7390;
    --success: #2D7D46; --warning: #C77D0D; --danger: #C0392B; --info: #3B7DD8;
    --pink: #E84A8F; --pink-light: #F8B8D0;
    --nav-bg: #3D2B45; --nav-text: #C9A3DC; --nav-active: #FFFFFF;
    --shadow: 0 2px 8px rgba(123,75,156,0.10);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; min-height: 100vh;
  }

  /* ====== 顶部标题 ====== */
  .top-bar {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white; padding: 14px 18px; position: sticky; top: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .top-bar h1 { font-size: 18px; font-weight: 700; }
  .top-bar .date { font-size: 11px; opacity: 0.85; }

  /* ====== 主区域 ====== */
  .main {
    flex: 1; min-width: 0; padding: 14px 14px 90px 14px;
    overflow-y: auto;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* ====== 通用卡片 ====== */
  .card {
    background: var(--card); border-radius: 10px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .card-title {
    font-size: 15px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
    color: var(--primary-dark);
  }
  .card-title .icon { font-size: 18px; }

  /* ====== 统计卡 ====== */
  .stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 14px;
  }
  .stat-card {
    background: var(--card); padding: 12px 14px; border-radius: 8px;
    box-shadow: var(--shadow); border-left: 3px solid var(--primary);
  }
  .stat-card.pink { border-left-color: var(--pink); }
  .stat-card.success { border-left-color: var(--success); }
  .stat-card.info { border-left-color: var(--info); }
  .stat-card.warning { border-left-color: var(--warning); }
  .stat-card .label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
  .stat-card .value { font-size: 20px; font-weight: 700; }
  .stat-card .unit { font-size: 11px; color: var(--text-light); font-weight: normal; margin-left: 2px; }

  /* ====== 表单元素 ====== */
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .form-row label { font-size: 12px; color: var(--text-light); font-weight: 600; }
  input[type="date"], input[type="number"], input[type="text"], select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 15px; font-family: inherit;
    background: var(--card); color: var(--text); transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--primary);
  }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .btn {
    padding: 10px 20px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-pink { background: var(--pink); color: white; }
  .btn-pink:hover { background: #C73A7F; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger { background: transparent; border: 1.5px solid #E8C0BC; color: var(--danger); padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  .btn-danger:hover { background: #FDE8E8; }

  /* ====== 表格 ====== */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 420px; border-collapse: collapse; font-size: 13px; }
  thead { position: sticky; top: 0; background: var(--card); z-index: 5; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  tbody tr:hover { background: var(--bg); }
  .empty-tip { text-align: center; padding: 30px 16px; color: var(--text-light); font-size: 13px; }

  /* ====== 底部导航 ====== */
  .sidebar {
    width: 100%; background: var(--nav-bg); color: var(--nav-text);
    display: flex; flex-direction: row; padding: 6px 4px;
    position: fixed; bottom: 0; left: 0; right: 0; top: auto;
    overflow-x: auto; overflow-y: hidden; z-index: 100;
    border-top: 1px solid rgba(255,255,255,0.1);
    justify-content: space-around;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 5px 10px; cursor: pointer; transition: all 0.2s;
    font-size: 10px; border-bottom: 2px solid transparent;
    border-radius: 6px; white-space: nowrap; min-width: 56px;
    color: var(--nav-text); user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #FFF; }
  .nav-item.active {
    background: rgba(255,255,255,0.1); color: var(--nav-active);
    border-bottom-color: var(--primary-light); font-weight: 600;
  }
  .nav-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px;
    font-size: 14px; flex-shrink: 0;
  }
  .nav-icon.period { background: #E84A8F; color: #FFF; }
  .nav-icon.weight { background: #3B7DD8; color: #FFF; }
  .nav-icon.anniv { background: #C77D0D; color: #FFF; }

  /* ====== 经期模块专用 ====== */
  .period-day-badge {
    display: inline-block; background: var(--pink-light); color: var(--pink);
    padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .period-day-badge.danger { background: #FDE8E8; color: var(--danger); }
  .period-day-badge.warning { background: #FFF3D6; color: var(--warning); }
  .period-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
  .period-cal .dow { text-align: center; font-size: 10px; color: var(--text-light); padding: 4px 0; }
  .period-cal .day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 12px; border-radius: 50%; background: var(--bg); position: relative;
  }
  .period-cal .day.period { background: var(--pink); color: white; font-weight: 700; }
  .period-cal .day.predicted { background: var(--pink-light); color: var(--pink); }
  .period-cal .day.fertile { background: #D8F0DC; color: #2D7D46; }
  .period-cal .day.ovulation { background: var(--success); color: white; font-weight: 700; }
  .period-cal .day.today { box-shadow: 0 0 0 2px var(--primary); }
  .period-cal .day.other-month { opacity: 0.3; }

  /* ====== 体重趋势图 ====== */
  .weight-chart { width: 100%; height: 180px; position: relative; margin: 10px 0; }
  .weight-chart svg { width: 100%; height: 100%; overflow: visible; }

  /* ====== 纪念日倒计时 ====== */
  .anniv-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px;
  }
  .anniv-item:last-child { border-bottom: none; }
  .anniv-info { flex: 1; min-width: 0; }
  .anniv-name { font-size: 14px; font-weight: 600; }
  .anniv-date { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .anniv-countdown { text-align: right; flex-shrink: 0; }
  .anniv-days { font-size: 22px; font-weight: 700; color: var(--primary); }
  .anniv-days.past { color: var(--text-light); }
  .anniv-label { font-size: 10px; color: var(--text-light); }

  /* ====== 工具栏 ====== */
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

  .hint { font-size: 11px; color: var(--text-light); margin-top: 8px; line-height: 1.6; }
  .days-left {
    background: #E8F3FB; color: var(--primary-dark);
    padding: 14px 12px; border-radius: 10px; text-align: center;
    font-size: 14px; font-weight: 700; margin-bottom: 12px;
  }
  .days-left strong { font-size: 18px; color: var(--primary); margin: 0 2px; }
  .diet-suggest {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 60;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); max-height: 210px; overflow-y: auto; margin-top: 4px;
  }
  .diet-suggest .diet-opt {
    padding: 11px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .diet-suggest .diet-opt:last-child { border-bottom: none; }
  .diet-suggest .diet-opt:hover { background: var(--bg); }
  #page-weight thead th, #weightTableBody td { white-space: nowrap; }
  #weightTableBody td:nth-child(2), #page-weight thead th:nth-child(2) { white-space: normal; width: 110px; min-width: 100px; vertical-align: top; text-align: left; }
  #weightTableBody td:nth-child(4), #page-weight thead th:nth-child(4) { white-space: normal; min-width: 120px; }
  .weight-form-line { display: flex; gap: 10px; align-items: stretch; }
  .weight-form-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .weight-form-col.date-col { flex: 1.05; }
  .weight-form-col.weight-col { flex: 1; }
  .weight-form-col input { height: 46px; padding: 0 10px; line-height: 46px; box-sizing: border-box; }
  .yr { font-size: 10px; color: var(--text-light); }
  .next-predict { font-size: 13px; color: var(--text-light); text-align: center; margin-bottom: 12px; }
  .diet-board-table { table-layout: fixed; }
  .diet-board-table th, .diet-board-table td { text-align: center; }
  .diet-board-table th:nth-child(1), .diet-board-table td:nth-child(1) { width: 12%; }
  .diet-board-table th:nth-child(2), .diet-board-table th:nth-child(3), .diet-board-table td:nth-child(2), .diet-board-table td:nth-child(3) { width: 26%; }
  .diet-board-table th:nth-child(4), .diet-board-table td:nth-child(4) { width: 36%; }
  .weight-scale-card {
    text-align: center; padding: 18px 8px 16px;
    background: linear-gradient(135deg, #2196F3, #03A9F4);
    border-radius: 16px; color: #fff;
  }
  .scale-date { font-size: 14px; color: rgba(255,255,255,0.92); margin-bottom: 14px; }
  .scale-main { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .scale-circle {
    width: 140px; height: 140px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12);
    flex-shrink: 0;
  }
  .scale-weight-row { display: flex; align-items: baseline; justify-content: center; gap: 3px; }
  .scale-weight { font-size: 40px; font-weight: 700; color: #fff; line-height: 1; text-align: center; }
  .scale-unit { font-size: 14px; color: rgba(255,255,255,0.9); margin-top: 4px; }
  .scale-side { flex: 1; min-width: 0; text-align: center; }
  .scale-side-label { font-size: 11px; color: rgba(255,255,255,0.85); margin-bottom: 5px; }
  .scale-side-value { font-size: 13px; font-weight: 700; color: #fff; }
  .scale-score { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.92); }
  .scale-arrow { font-size: 10px; margin-right: 2px; }
  .chart-popup {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 12px 14px; margin-top: 8px;
    font-size: 13px; color: var(--text); position: relative;
  }
  .chart-popup .pop-date { font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
  .chart-popup .pop-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .chart-popup .pop-label { color: var(--text-light); }
  .chart-popup .pop-value { font-weight: 700; }
  .chart-popup .pop-close {
    position: absolute; top: 4px; right: 8px; font-size: 16px; color: var(--text-light);
    cursor: pointer; line-height: 1;
  }
  .section-divider { height: 1px; background: var(--border); margin: 14px 0; }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600;
  }
</style>
</head>
<body>

<!-- ====== 顶部标题栏 ====== -->
<div class="top-bar">
  <h1 id="topTitle">经期</h1>
  <span class="date" id="topDate"></span>
</div>

<!-- ====== 主区域 ====== -->
<div class="main">

  <!-- ========== 经期记录 ========== -->
  <div class="page active" id="page-period">
    <div class="card">
      <div class="card-title"><span class="icon">🌸</span>记录经期</div>
      <div class="days-left" id="periodDaysLeft"></div>
      <div class="next-predict" id="periodNextLine"></div>
      <button class="btn btn-pink" onclick="savePeriod()" style="width:100%;">经期刚刚开始</button>
    </div>

    <!-- 经期日历 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">📅</span>经期日历
        <span style="margin-left:auto; display:flex; gap:6px;">
          <button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="shiftCalendar(-1)">上月</button>
          <span id="calMonthLabel" style="font-size:13px;font-weight:600;min-width:70px;text-align:center;"></span>
          <button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="shiftCalendar(1)">下月</button>
        </span>
      </div>
      <div class="period-cal" id="periodCal"></div>
      <div class="hint">
        <span style="display:inline-block;width:10px;height:10px;background:var(--pink);border-radius:50%;vertical-align:middle;"></span> 实际经期
        <span style="display:inline-block;width:10px;height:10px;background:var(--pink-light);border-radius:50%;vertical-align:middle;margin-left:8px;"></span> 预测经期
        <span style="display:inline-block;width:10px;height:10px;background:var(--success);border-radius:50%;vertical-align:middle;margin-left:8px;"></span> 排卵日
        <span style="display:inline-block;width:10px;height:10px;background:#D8F0DC;border-radius:50%;vertical-align:middle;margin-left:8px;"></span> 易孕期
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">📜</span>历史记录
        <span id="periodAvgCycleInline" style="margin-left:auto;font-size:12px;font-weight:600;color:var(--text-light);"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>开始日期</th><th>距离上次</th><th></th></tr></thead>
          <tbody id="periodTableBody"></tbody>
        </table>
      </div>
      <div id="periodEmpty" class="empty-tip">暂无经期记录</div>
    </div>
  </div>

  <!-- ========== 体重记录 ========== -->
  <div class="page" id="page-weight">
    <div class="card">
      <div class="card-title"><span class="icon">⚖️</span>记录体重</div>
      <div class="form-row">
        <div class="weight-form-line">
          <div class="weight-form-col date-col">
            <label>日期</label>
            <input type="date" id="weightDate" lang="zh-CN">
          </div>
          <div class="weight-form-col weight-col">
            <label>体重（kg）</label>
            <input type="number" id="weightVal" step="0.01" placeholder="如 55.50">
          </div>
        </div>
      </div>
      <div class="form-row" style="position:relative;">
        <label>饮食（可选）</label>
        <input type="text" id="weightNote" placeholder="如早餐鸡蛋牛奶、午餐沙拉" autocomplete="off">
        <div id="dietSuggest" class="diet-suggest" style="display:none;"></div>
      </div>
      <button class="btn btn-primary" onclick="saveWeight()" style="width:100%;">保存记录</button>
    </div>

    <!-- 体重统计（圆形秤样式） -->
    <div class="card">
      <div class="card-title"><span class="icon">📈</span>体重统计</div>
      <div class="weight-scale-card" id="weightScaleCard">
        <div class="scale-date" id="scaleDate">--</div>
        <div class="scale-main">
          <div class="scale-side" id="scaleTargetDiff">
            <div class="scale-side-label">离目标还差</div>
            <div class="scale-side-value">--</div>
          </div>
          <div class="scale-circle">
            <div class="scale-weight" id="scaleWeight">--</div>
            <div class="scale-unit">公斤</div>
          </div>
          <div class="scale-side" id="scaleLastDiff">
            <div class="scale-side-label">比上次测量</div>
            <div class="scale-side-value">--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 体重趋势图 -->
    <div class="card">
      <div class="card-title">
        <span class="icon">📉</span>体重趋势图
        <span style="margin-left:auto;display:flex;gap:6px;align-items:center;">
          <button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="shiftWeightChart(-1)">上月</button>
          <span id="weightChartMonthLabel" style="font-size:13px;font-weight:600;min-width:70px;text-align:center;"></span>
          <button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="shiftWeightChart(1)">下月</button>
        </span>
      </div>
      <div class="weight-chart" id="weightChart" style="height:220px;"></div>
      <div id="weightChartPopup" class="chart-popup" style="display:none;"></div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
      <div class="card-title"><span class="icon">📜</span>历史记录</div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>变化</th><th>日期</th><th>体重</th><th>饮食</th><th></th></tr></thead>
          <tbody id="weightTableBody"></tbody>
        </table>
      </div>
      <div id="weightEmpty" class="empty-tip">暂无体重记录</div>
    </div>

    <!-- 饮食掉秤榜 -->
    <div class="card">
      <div class="card-title"><span class="icon">🏆</span>饮食掉秤榜</div>
      <div class="table-scroll">
        <table class="diet-board-table">
          <thead><tr><th>#</th><th>最高幅度</th><th>最低幅度</th><th>食物</th></tr></thead>
          <tbody id="dietBoardBody"></tbody>
        </table>
      </div>
      <div id="dietBoardEmpty" class="empty-tip">暂无掉秤记录</div>
    </div>
  </div>

  <!-- ========== 纪念日 ========== -->
  <div class="page" id="page-anniv">
    <div class="card">
      <div class="card-title"><span class="icon">🎉</span>添加纪念日</div>
      <div class="form-row">
        <label>名称</label>
        <input type="text" id="annivName" placeholder="如结婚纪念日、生日">
      </div>
      <div class="form-row">
        <label>日期</label>
        <input type="date" id="annivDate" lang="zh-CN">
      </div>
      <div class="form-row">
        <label>类型</label>
        <select id="annivType">
          <option value="anniversary" selected>每年纪念日</option>
          <option value="countdown">倒计时（单次）</option>
          <option value="together">在一起天数</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="saveAnniv()" style="width:100%;">保存</button>
    </div>

    <!-- 纪念日列表 -->
    <div class="card">
      <div class="card-title"><span class="icon">💌</span>纪念日列表</div>
      <div id="annivList"></div>
      <div id="annivEmpty" class="empty-tip">暂无纪念日</div>
    </div>
  </div>

</div>

<!-- ====== 底部导航 ====== -->
<div class="sidebar">
  <div class="nav-item active" data-page="period" onclick="switchPage('period')">
    <span class="nav-icon period">🌸</span><span>经期</span>
  </div>
  <div class="nav-item" data-page="weight" onclick="switchPage('weight')">
    <span class="nav-icon weight">⚖️</span><span>体重</span>
  </div>
  <div class="nav-item" data-page="anniv" onclick="switchPage('anniv')">
    <span class="nav-icon anniv">🎉</span><span>纪念日</span>
  </div>
</div>

<script>
// ====== 数据持久化 ======
const KEY_PERIOD = 'dr_period_v1';
const KEY_WEIGHT = 'dr_weight_v1';
const KEY_ANNIV  = 'dr_anniv_v1';

let periods = JSON.parse(localStorage.getItem(KEY_PERIOD) || '[]');
let weights = JSON.parse(localStorage.getItem(KEY_WEIGHT) || '[]');
let annivs  = JSON.parse(localStorage.getItem(KEY_ANNIV)  || '[]');
let dietHistory = JSON.parse(localStorage.getItem('dr_diet_v1') || '[]');
let weightTarget = 64; // 固定目标体重 64kg

function savePeriods() { localStorage.setItem(KEY_PERIOD, JSON.stringify(periods)); }
function saveWeights() { localStorage.setItem(KEY_WEIGHT, JSON.stringify(weights)); }
function saveAnnivs()  { localStorage.setItem(KEY_ANNIV,  JSON.stringify(annivs)); }

// ====== 工具函数 ======
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function daysBetween(a, b) {
  return Math.round((parseDate(b) - parseDate(a)) / 86400000);
}
function cnDate(s) {
  if (!s) return '';
  const d = parseDate(s);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function getRelativeDayLabel(dateStr) {
  const d = daysBetween(dateStr, todayStr());
  if (d === 0) return '今天';
  if (d === 1) return '昨天';
  if (d === -1) return '明天';
  return cnDate(dateStr);
}
function calcWeightScore(current, target) {
  if (!target || target <= 0 || weights.length < 2) return null;
  const vals = weights.map(w => w.val);
  const maxW = Math.max(...vals), minW = Math.min(...vals);
  if (target < current) {
    const denom = maxW - target;
    if (denom <= 0) return null;
    return Math.max(0, Math.min(100, Math.round((maxW - current) / denom * 100)));
  }
  if (target > current) {
    const denom = target - minW;
    if (denom <= 0) return null;
    return Math.max(0, Math.min(100, Math.round((current - minW) / denom * 100)));
  }
  return 100;
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtKg(n, signed) {
  if (n === null || n === undefined || isNaN(n)) return '--';
  const s = Math.abs(n).toFixed(2).replace(/\.?0+$/, '');
  if (n > 0 && signed) return '+' + s;
  if (n < 0) return '-' + s;
  return s;
}

const PAGE_TITLES = { period: '经期', weight: '体重', anniv: '纪念日' };
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');

}

// ====== 经期模块 ======
function savePeriod() {
  const start = todayStr();
  periods.push({ start, end: null, flow: 'normal', note: '', ts: Date.now() });
  periods.sort((a,b) => a.start < b.start ? -1 : 1);
  savePeriods();
  renderPeriod();
  alert('已保存，记录日期：' + cnDate(start));
}

function deletePeriod(ts) {
  if (!confirm('确认删除这条经期记录？')) return;
  periods = periods.filter(p => p.ts !== ts);
  savePeriods();
  renderPeriod();
}

function getPeriodDuration(p) {
  if (!p.end) return null;
  return daysBetween(p.start, p.end) + 1;
}

function getAvgCycle() {
  if (periods.length < 2) return null;
  let total = 0, count = 0;
  for (let i = 1; i < periods.length; i++) {
    total += daysBetween(periods[i-1].start, periods[i].start);
    count++;
  }
  return Math.round(total / count);
}

function getAvgDuration() {
  const valid = periods.map(getPeriodDuration).filter(d => d !== null);
  if (!valid.length) return null;
  return Math.round(valid.reduce((a,b) => a+b, 0) / valid.length);
}

function getNextPeriodPredict() {
  if (periods.length === 0) return null;
  const last = periods[periods.length - 1];
  const avgCycle = getAvgCycle();
  const cycle = avgCycle || 28;
  const d = parseDate(last.start);
  d.setDate(d.getDate() + cycle);
  return fmtDate(d);
}

// 排卵日预测：下次经期预测日往前推14天（黄体期固定14天）
function getOvulationPredict() {
  const next = getNextPeriodPredict();
  if (!next) return null;
  const d = parseDate(next);
  d.setDate(d.getDate() - 14);
  return fmtDate(d);
}

// 易孕窗口：排卵日前5天 ~ 后1天
function getFertileDays() {
  const ovu = getOvulationPredict();
  const set = new Set();
  if (!ovu) return set;
  const od = parseDate(ovu);
  for (let i = -5; i <= 1; i++) {
    const d = new Date(od);
    d.setDate(d.getDate() + i);
    set.add(fmtDate(d));
  }
  return set;
}

function renderPeriod() {
  // 统计（统计卡已移除，此处仅用于下方计算）
  const avgCycle = getAvgCycle();
  const next = getNextPeriodPredict();

  // 记录卡：还剩多少天（文字“还有”，数字标红）
  const daysLeftEl = document.getElementById('periodDaysLeft');
  if (!next) {
    daysLeftEl.innerHTML = '记录首次经期后开始计算周期与倒计时。';
  } else {
    const dl = daysBetween(todayStr(), next);
    if (dl > 0) daysLeftEl.innerHTML = '还有 <strong style="color:var(--danger)">' + dl + '</strong> 天';
    else if (dl === 0) daysLeftEl.innerHTML = '⚠️ 预测经期就在今天，请留意身体变化。';
    else daysLeftEl.innerHTML = '已超过预测经期 <strong style="color:var(--danger)">' + Math.abs(dl) + '</strong> 天，留意是否漏记。';
  }
  // 记录卡：下次预测日期
  document.getElementById('periodNextLine').textContent = next ? ('下次预测 ' + cnDate(next)) : '';

  // 日历
  renderCalendar();

  // 历史表
  const tbody = document.getElementById('periodTableBody');
  const empty = document.getElementById('periodEmpty');
  const avgInline = document.getElementById('periodAvgCycleInline');
  if (avgCycle) avgInline.textContent = '平均周期 ' + avgCycle + ' 天';
  else avgInline.textContent = '';

  if (periods.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const asc = periods.slice().sort((a, b) => a.start < b.start ? -1 : 1);
    tbody.innerHTML = periods.slice().reverse().map(p => {
      const idx = asc.findIndex(x => x.ts === p.ts);
      let since = '—';
      if (idx > 0) since = daysBetween(asc[idx - 1].start, p.start) + ' 天';
      return `<tr>
        <td>${cnDate(p.start)}</td>
        <td>${since}</td>
        <td><button class="btn btn-danger" onclick="deletePeriod(${p.ts})">删除</button></td>
      </tr>`;
    }).join('');
  }
}

// ====== 经期日历 ======
let calYear, calMonth;
{
  const d = new Date();
  calYear = d.getFullYear(); calMonth = d.getMonth();
}

function shiftCalendar(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  const labels = ['日','一','二','三','四','五','六'];
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthLabel').textContent = `${calYear}年${monthNames[calMonth]}`;

  const firstDay = new Date(calYear, calMonth, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  const today = todayStr();

  // 预测经期日
  const predictedDays = new Set();
  const next = getNextPeriodPredict();
  if (next) {
    const avgDur = getAvgDuration() || 5;
    const nd = parseDate(next);
    for (let i = 0; i < avgDur; i++) {
      const d = new Date(nd);
      d.setDate(d.getDate() + i);
      predictedDays.add(fmtDate(d));
    }
  }

  // 实际经期日
  const periodDays = new Set();
  for (const p of periods) {
    if (!p.end) {
      periodDays.add(p.start);
    } else {
      let d = parseDate(p.start);
      const end = parseDate(p.end);
      while (d <= end) {
        periodDays.add(fmtDate(d));
        d.setDate(d.getDate() + 1);
      }
    }
  }

  // 排卵日 + 易孕窗口
  const ovuDay = getOvulationPredict();
  const fertileDays = getFertileDays();

  let html = '';
  for (let i = 0; i < 7; i++) html += `<div class="dow">${labels[i]}</div>`;

  for (let i = startDow - 1; i >= 0; i--) {
    html += `<div class="day other-month">${prevMonthDays - i}</div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'day';
    if (periodDays.has(ds)) cls += ' period';
    else if (predictedDays.has(ds)) cls += ' predicted';
    else if (ds === ovuDay) cls += ' ovulation';
    else if (fertileDays.has(ds)) cls += ' fertile';
    if (ds === today) cls += ' today';
    html += `<div class="${cls}">${d}</div>`;
  }
  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) html += `<div class="day other-month">${i}</div>`;

  document.getElementById('periodCal').innerHTML = html;
}

// ====== 体重模块 ======
function saveWeight() {
  const date = document.getElementById('weightDate').value;
  const val = parseFloat(document.getElementById('weightVal').value);
  const note = document.getElementById('weightNote').value.trim();
  if (!date) { alert('请选择日期'); return; }
  if (isNaN(val) || val <= 0 || val > 500) { alert('请输入合理的体重'); return; }

  // 同一天覆盖
  const existing = weights.find(w => w.date === date);
  if (existing) {
    existing.val = val; existing.note = note; existing.ts = Date.now();
  } else {
    weights.push({ date, val, note, ts: Date.now() });
  }
  weights.sort((a,b) => a.date < b.date ? -1 : 1);
  saveWeights();
  document.getElementById('weightDate').value = '';
  document.getElementById('weightVal').value = '';
  document.getElementById('weightNote').value = '';
  renderWeight();
  alert('已保存');
}

function deleteWeight(ts) {
  if (!confirm('确认删除这条体重记录？')) return;
  weights = weights.filter(w => w.ts !== ts);
  saveWeights();
  renderWeight();
}

// 区间总变化（斤）：末-初，负=减重；1kg=2斤
function totalChangeJin(list) {
  if (list.length < 2) return '--';
  const sorted = list.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const jin = (sorted[sorted.length - 1].val - sorted[0].val) * 2;
  if (Math.abs(jin) < 0.05) return '持平';
  if (jin < 0) return `<span style="color:var(--success)">减重 ${Math.abs(jin).toFixed(2)}</span><span class="unit">斤</span>`;
  return `<span style="color:var(--danger)">增重 ${jin.toFixed(2)}</span><span class="unit">斤</span>`;
}

function renderWeight() {
  // 圆形秤统计卡
  const scaleDate = document.getElementById('scaleDate');
  const scaleWeight = document.getElementById('scaleWeight');
  const scaleTargetDiff = document.querySelector('#scaleTargetDiff .scale-side-value');
  const scaleLastDiff = document.querySelector('#scaleLastDiff .scale-side-value');

  if (weights.length === 0) {
    scaleDate.textContent = '--';
    scaleWeight.textContent = '--';
    scaleTargetDiff.innerHTML = '--';
    scaleLastDiff.innerHTML = '--';
  } else {
    const latest = weights[weights.length - 1];
    const prev = weights.length >= 2 ? weights[weights.length - 2] : null;

    scaleDate.textContent = getRelativeDayLabel(latest.date);
    scaleWeight.textContent = fmtKg(latest.val);

    // 离目标还差（白色）
    const td = latest.val - weightTarget;
    scaleTargetDiff.innerHTML = `${fmtKg(td, true)}公斤`;

    // 比上次测量（白色）
    if (prev) {
      const diff = latest.val - prev.val;
      const arrow = diff < 0 ? '▼' : (diff > 0 ? '▲' : '');
      scaleLastDiff.innerHTML = `<span class="scale-arrow">${arrow}</span>${fmtKg(diff, true)}公斤`;
    } else {
      scaleLastDiff.innerHTML = '--';
    }
  }

  // 图表
  renderWeightChartMonth('weightChart');

  // 历史表
  const tbody = document.getElementById('weightTableBody');
  const empty = document.getElementById('weightEmpty');
  if (weights.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const reversed = weights.slice().reverse();
    tbody.innerHTML = reversed.map((w, i) => {
      const next = reversed[i - 1]; // 按时间顺序的下一天
      let change = '';
      if (next) {
        const diff = next.val - w.val; // 明日 - 今日
        const color = diff > 0 ? 'var(--danger)' : (diff < 0 ? 'var(--success)' : 'var(--text-light)');
        change = `<span style="color:${color}">${fmtKg(diff, true)}kg</span>`;
      } else {
        change = '--';
      }
      return `<tr>
        <td>${change}</td>
        <td>${mdyDateBr(w.date)}</td>
        <td><strong>${fmtKg(w.val)}</strong> kg</td>
        <td style="font-size:11px;color:var(--text-light)">${w.note || ''}</td>
        <td><button class="btn btn-danger" onclick="deleteWeight(${w.ts})">删除</button></td>
      </tr>`;
    }).join('');
  }

  // 饮食记忆 + 掉秤榜
  refreshDietHistory();
  renderDietLossBoard();
}

let chartYear, chartMonth;
{
  const d = new Date();
  chartYear = d.getFullYear(); chartMonth = d.getMonth();
}
function shiftWeightChart(delta) {
  chartMonth += delta;
  if (chartMonth < 0) { chartMonth = 11; chartYear--; }
  if (chartMonth > 11) { chartMonth = 0; chartYear++; }
  renderWeightChartMonth('weightChart');
}
function showWeightPointPopup(date, val, change, food) {
  const popup = document.getElementById('weightChartPopup');
  // 复位所有圆点为默认色，再把被点击的圆点标红
  document.querySelectorAll('#weightChart circle').forEach(c => c.setAttribute('fill', 'var(--info)'));
  const hit = Array.from(document.querySelectorAll('#weightChart circle')).find(c => c.getAttribute('data-date') === date);
  if (hit) hit.setAttribute('fill', 'var(--danger)');
  const chHtml = change === null ? '--' : `<span style="color:${change < 0 ? 'var(--success)' : (change > 0 ? 'var(--danger)' : 'var(--text-light)')}">${fmtKg(change, true)}kg</span>`;
  popup.innerHTML = `
    <span class="pop-close" onclick="document.getElementById('weightChartPopup').style.display='none'">×</span>
    <div class="pop-date">${cnDate(date)}</div>
    <div class="pop-row"><span class="pop-label">体重</span><span class="pop-value">${fmtKg(val)}kg</span></div>
    <div class="pop-row"><span class="pop-label">变化</span><span class="pop-value">${chHtml}</span></div>
    <div class="pop-row"><span class="pop-label">饮食</span><span class="pop-value">${food || '—'}</span></div>
  `;
  popup.style.display = 'block';
}
function renderWeightChartMonth(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('weightChartMonthLabel').textContent = `${chartYear}年${monthNames[chartMonth]}`;

  // 筛选当月数据
  const data = weights.filter(w => {
    const d = parseDate(w.date);
    return d.getFullYear() === chartYear && d.getMonth() === chartMonth;
  }).sort((a, b) => a.date < b.date ? -1 : 1);

  if (data.length === 0) { el.innerHTML = '<div class="empty-tip" style="padding:20px;">该月暂无数据</div>'; return; }

  const w = el.offsetWidth || 300;
  const h = el.offsetHeight || 180;
  const pad = { top: 20, right: 20, bottom: 30, left: 40 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  const daysInMonth = new Date(chartYear, chartMonth + 1, 0).getDate();

  const vals = data.map(d => d.val);
  let minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  minV -= range * 0.2; maxV += range * 0.2;
  const span = maxV - minV;

  // 为每个数据点计算下一天的变化
  const allAsc = weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  function nextChange(d) {
    const idx = allAsc.findIndex(x => x.date === d.date && x.ts === d.ts);
    if (idx >= 0 && idx < allAsc.length - 1) return allAsc[idx + 1].val - d.val;
    return null;
  }

  const points = data.map(d => {
    const day = parseDate(d.date).getDate();
    const x = pad.left + ((day - 1) / (daysInMonth - 1)) * cw;
    const y = pad.top + ch - ((d.val - minV) / span) * ch;
    return { x, y, val: d.val, date: d.date, food: d.note, ts: d.ts };
  });

  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${(pad.top+ch).toFixed(1)} L${points[0].x.toFixed(1)},${(pad.top+ch).toFixed(1)} Z`;

  // Y 轴刻度
  let yTicks = '';
  for (let i = 0; i <= 2; i++) {
    const v = minV + (span * i / 2);
    const y = pad.top + ch - (i / 2) * ch;
    yTicks += `<line x1="${pad.left}" y1="${y}" x2="${w-pad.right}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`;
    yTicks += `<text x="${pad.left-6}" y="${y+3}" font-size="9" fill="var(--text-light)" text-anchor="end">${fmtKg(v)}</text>`;
  }

  // X 轴标签（每5天显示一个）
  let xLabels = '';
  for (let day = 1; day <= daysInMonth; day += 5) {
    const x = pad.left + ((day - 1) / (daysInMonth - 1)) * cw;
    xLabels += `<text x="${x}" y="${h-8}" font-size="9" fill="var(--text-light)" text-anchor="middle">${day}日</text>`;
  }

  const dots = points.map(p => {
    const ch = nextChange(p);
    const safeDate = p.date.replace(/'/g, "\\'");
    const safeFood = (p.food || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--info)" data-date="${p.date}" style="cursor:pointer;" onclick="showWeightPointPopup('${safeDate}', ${p.val}, ${ch === null ? 'null' : ch}, '${safeFood}')"/>`;
  }).join('');

  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="grad-${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B7DD8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B7DD8" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${yTicks}
    <path d="${areaD}" fill="url(#grad-${id})"/>
    <path d="${pathD}" fill="none" stroke="#3B7DD8" stroke-width="2"/>
    ${dots}
    ${xLabels}
  </svg>`;
}


// ====== 饮食辅助 ======
function mdyDate(s) {
  const d = parseDate(s);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${mm}-${dd}-${d.getFullYear()}`;
}

function mdyDateBr(s) {
  const d = parseDate(s);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${mm}-${dd}-<br><span class="yr">${d.getFullYear()}</span>`;
}

function refreshDietHistory() {
  const set = new Set();
  weights.forEach(w => { if (w.note && w.note.trim()) set.add(w.note.trim()); });
  dietHistory = Array.from(set);
  try { localStorage.setItem('dr_diet_v1', JSON.stringify(dietHistory)); } catch (e) {}
}

function renderDietLossBoard() {
  const tbody = document.getElementById('dietBoardBody');
  const empty = document.getElementById('dietBoardEmpty');
  const sorted = weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const events = [];
  for (let i = 1; i < sorted.length; i++) {
    const loss = sorted[i-1].val - sorted[i].val; // 较前一天轻了 = 掉秤(正,kg)
    if (loss > 0) {
      events.push({ lossKg: loss, food: (sorted[i].note || '').trim() || '—' });
    }
  }
  // 按食物分组：同一食物取最高/最低掉秤
  const byFood = {};
  for (const e of events) {
    if (!byFood[e.food]) byFood[e.food] = { food: e.food, max: e.lossKg, min: e.lossKg };
    else {
      if (e.lossKg > byFood[e.food].max) byFood[e.food].max = e.lossKg;
      if (e.lossKg < byFood[e.food].min) byFood[e.food].min = e.lossKg;
    }
  }
  const rows = Object.values(byFood);
  rows.sort((a, b) => b.max - a.max); // 按最高掉秤幅度排序
  if (rows.length === 0) {
    tbody.innerHTML = ''; empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = rows.map((r, idx) => `<tr>
      <td style="font-weight:700;color:var(--text-light);">${idx + 1}</td>
      <td style="color:var(--success);font-weight:700;white-space:nowrap;">${fmtKg(r.max)}kg</td>
      <td style="color:var(--warning);white-space:nowrap;">${fmtKg(r.min)}kg</td>
      <td style="white-space:normal;min-width:120px;">${r.food}</td>
    </tr>`).join('');
  }
}

function initDietAutocomplete() {
  const noteInput = document.getElementById('weightNote');
  const box = document.getElementById('dietSuggest');
  noteInput.addEventListener('input', () => {
    const v = noteInput.value.trim();
    const matches = dietHistory.filter(x => x !== v && x.includes(v)).slice(0, 8);
    if (!v || matches.length === 0) { box.style.display = 'none'; return; }
    box.innerHTML = '';
    matches.forEach(m => {
      const opt = document.createElement('div');
      opt.className = 'diet-opt';
      opt.textContent = m;
      opt.addEventListener('click', () => { noteInput.value = m; box.style.display = 'none'; noteInput.focus(); });
      box.appendChild(opt);
    });
    box.style.display = 'block';
  });
  noteInput.addEventListener('blur', () => setTimeout(() => { box.style.display = 'none'; }, 150));
}

// ====== 纪念日模块 ======
function saveAnniv() {
  const name = document.getElementById('annivName').value.trim();
  const date = document.getElementById('annivDate').value;
  const type = document.getElementById('annivType').value;
  if (!name) { alert('请输入名称'); return; }
  if (!date) { alert('请选择日期'); return; }
  annivs.push({ name, date, type, ts: Date.now() });
  saveAnnivs();
  document.getElementById('annivName').value = '';
  document.getElementById('annivDate').value = '';
  renderAnniv();
  alert('已保存');
}

function deleteAnniv(ts) {
  if (!confirm('确认删除这个纪念日？')) return;
  annivs = annivs.filter(a => a.ts !== ts);
  saveAnnivs();
  renderAnniv();
}

function getAnnivInfo(a) {
  const today = todayStr();
  const target = parseDate(a.date);
  if (a.type === 'together') {
    const days = daysBetween(a.date, today);
    return { days: Math.max(0, days), label: '在一起', past: false, isTogether: true };
  }
  if (a.type === 'countdown') {
    const days = daysBetween(today, a.date);
    return { days, label: days >= 0 ? '天后' : '天前', past: days < 0 };
  }
  // anniversary: 计算今年/明年的纪念日
  const year = new Date().getFullYear();
  let thisYear = new Date(year, target.getMonth(), target.getDate());
  if (thisYear < new Date(today + 'T00:00:00')) {
    thisYear = new Date(year + 1, target.getMonth(), target.getDate());
  }
  const days = Math.round((thisYear - new Date(today + 'T00:00:00')) / 86400000);
  const age = year - target.getFullYear() - (thisYear.getFullYear() === year + 1 ? 1 : 0);
  return { days, label: '天后', past: false, age, isAnniversary: true, thisYearDate: fmtDate(thisYear) };
}

function renderAnniv() {
  const list = document.getElementById('annivList');
  const empty = document.getElementById('annivEmpty');
  if (annivs.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // 排序：按倒计时升序（已过的放后面）
  const sorted = annivs.map(a => ({ a, info: getAnnivInfo(a) })).sort((x, y) => {
    if (x.info.past && !y.info.past) return 1;
    if (!x.info.past && y.info.past) return -1;
    return x.info.days - y.info.days;
  });

  list.innerHTML = sorted.map(({ a, info }) => {
    const typeLabels = { anniversary: '每年纪念日', countdown: '倒计时', together: '在一起' };
    let ageStr = '';
    if (info.isAnniversary && info.age !== undefined) ageStr = `<span style="font-size:11px;color:var(--text-light)">第${info.age}个</span>`;
    if (info.isTogether) ageStr = '';
    return `<div class="anniv-item">
      <div class="anniv-info">
        <div class="anniv-name">${a.name}</div>
        <div class="anniv-date">${cnDate(a.date)} · ${typeLabels[a.type]}</div>
      </div>
      <div class="anniv-countdown">
        <div class="anniv-days ${info.past ? 'past' : ''}">${info.days}</div>
        <div class="anniv-label">${info.label}</div>
        ${ageStr}
      </div>
      <button class="btn btn-danger" onclick="deleteAnniv(${a.ts})" style="margin-left:8px;">删除</button>
    </div>`;
  }).join('');
}


// ====== 初始化 ======
function init() {
  // 顶部日期
  const d = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('topDate').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
  document.getElementById('topTitle').textContent = PAGE_TITLES['period'];
  document.title = PAGE_TITLES['period'] + '记录台';

  // 默认日期填入今天
  document.getElementById('weightDate').value = todayStr();
  document.getElementById('annivDate').value = todayStr();
  initDietAutocomplete();

  renderPeriod();
}

init();
